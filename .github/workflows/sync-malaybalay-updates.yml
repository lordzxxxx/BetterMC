name: Sync Malaybalay Public Announcements & PESO Jobs

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-live-feeds:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Scan Official City of Malaybalay & PESO Feeds
        run: node scripts/sync-live-updates.mjs
